# 交易日誌設定（範本）。複製成 config.yaml 再改；config.yaml 不進 git。
local_dir: ~/stock-journal            # 本機日誌資料夾（會被整個同步）
rclone_remote: gdrive                  # rclone config 裡的 remote 名稱
rclone_path: stock-journal             # Google Drive 上的資料夾
auto_sync: true                        # 每次 add/close/check 後自動 rclone
falsify_grace_days: 2                  # 證偽條件觸發後幾天內出場算「有守紀律」
thesis_types: [族群流入, 技術突破, 均線回測, 基本面, 事件, 長期持有, 其他]
longterm_types: [長期持有]            # 只追蹤現價與超額報酬，不進勝率/期望值統計、不做持有期提醒
benchmark_tw: ^TWII                    # 台股同期大盤（上櫃股也用加權，方便跨股比較）
benchmark_us: ^GSPC                    # 美股同期大盤

# 交易成本（close 時算含成本淨損益；review 同時列毛／淨）。台股金額無條件捨去到元。
fees:
  tw_fee_rate: 0.001425      # 手續費牌告費率
  tw_fee_discount: 0.6       # 券商折扣（六折）
  tw_fee_min: 20             # 每筆最低手續費（零股券商多為 1 元，依自己券商改）
  tw_tax_stock: 0.003        # 證交稅（賣出）：股票
  tw_tax_etf: 0.001          # 證交稅：ETF（代號 00 開頭）
  tw_tax_daytrade: 0.0015    # 證交稅：現股當沖（同日進出的股票）
  us_fee_per_trade: 0        # 美股每筆固定手續費（與股價同幣別）
  us_fee_rate: 0             # 美股按成交金額比例的手續費
